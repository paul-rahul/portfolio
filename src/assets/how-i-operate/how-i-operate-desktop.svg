<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="how-i-operate-desktop-title how-i-operate-desktop-desc">
<title id="how-i-operate-desktop-title">How I operate</title>
<desc id="how-i-operate-desktop-desc">Five-step operating model with a feedback loop from Measure back to Understand the system.</desc>

<defs>
  <marker id="operate-arrow-desktop" markerWidth="8" markerHeight="8" refX="7" refY="4"
          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0 L8 4 L0 8 Z" fill="var(--accent, #7285ff)"/>
  </marker>
</defs>
<rect width="1600" height="560" fill="transparent"/>
<text x="42" y="72" fill="var(--ink, #f4f4f5)" font-family="var(--font-heading, Inter, system-ui, sans-serif)" font-size="54" font-weight="700">How I operate.</text>

<g stroke="var(--accent, #7285ff)" stroke-width="2" fill="none" marker-end="url(#operate-arrow-desktop)">
  <line x1="275" y1="205" x2="390" y2="205"/>
  <line x1="585" y1="205" x2="700" y2="205"/>
  <line x1="895" y1="205" x2="1010" y2="205"/>
  <line x1="1205" y1="205" x2="1320" y2="205"/>
</g>

<g font-family="var(--font-mono, ui-monospace, monospace)" font-weight="700" fill="var(--accent, #7285ff)" font-size="16">
  <text x="175" y="115">01</text><text x="485" y="115">02</text><text x="795" y="115">03</text><text x="1105" y="115">04</text><text x="1415" y="115">05</text>
</g>

<g fill="none" stroke="var(--accent, #7285ff)" stroke-width="2">
  <circle cx="190" cy="205" r="55"/><circle cx="500" cy="205" r="55"/><circle cx="810" cy="205" r="55"/><circle cx="1120" cy="205" r="55"/><circle cx="1430" cy="205" r="55"/>
</g>
<g transform="translate(170.0 185.0) scale(1.25)" stroke="var(--accent, #7285ff)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="18" r="5"/><circle cx="22" cy="18" r="5"/><path d="M9 13l3-7h4l2 7M23 13l-3-7h-4l-2 7M15 18h2"/></g>
<g transform="translate(480.0 185.0) scale(1.25)" stroke="var(--accent, #7285ff)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="5" width="13" height="20" rx="2"/><line x1="11" y1="10" x2="18" y2="10"/><circle cx="22" cy="21" r="4"/><line x1="25" y1="24" x2="29" y2="28"/></g>
<g transform="translate(790.8 185.8) scale(1.2)" stroke="var(--accent, #7285ff)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="12" r="4"/><circle cx="21" cy="12" r="4"/><path d="M4 26c0-5 3-8 7-8s7 3 7 8"/><path d="M14 26c0-5 3-8 7-8s7 3 7 8"/></g>
<g transform="translate(1100.8 185.8) scale(1.2)" stroke="var(--accent, #7285ff)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15L28 5 19 28 14 19 4 15Z"/><path d="M14 19L28 5"/></g>
<g transform="translate(1410.8 185.8) scale(1.2)" stroke="var(--accent, #7285ff)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="27" x2="29" y2="27"/><line x1="8" y1="27" x2="8" y2="18"/><line x1="15" y1="27" x2="15" y2="12"/><line x1="22" y1="27" x2="22" y2="7"/></g>

<g fill="var(--ink, #f4f4f5)" font-family="var(--font-heading, Inter, system-ui, sans-serif)" font-size="28" font-weight="700" text-anchor="middle">
  <text x="190" y="305"><tspan x="190">Understand</tspan><tspan x="190" dy="32">the system</tspan></text>
  <text x="500" y="305"><tspan x="500">Find the</tspan><tspan x="500" dy="32">constraint</tspan></text>
  <text x="810" y="305">Align the team</text>
  <text x="1120" y="305">Ship</text>
  <text x="1430" y="305">Measure</text>
</g>

<!-- feedback loop: 05 -> 01, exactly one arrowhead at destination -->
<path d="M1430 360
         C1515 360 1515 470 1430 470
         L200 470
         C115 470 115 360 190 360"
      stroke="var(--accent, #7285ff)" stroke-width="2" stroke-dasharray="4 8"
      fill="none" marker-end="url(#operate-arrow-desktop)"/>

<rect x="655" y="452" width="290" height="38" rx="19"
      fill="var(--background, #111113)" stroke="var(--accent, #7285ff)" stroke-width="1.5"/>
<text x="800" y="477" text-anchor="middle" fill="var(--accent, #7285ff)"
      font-family="var(--font-mono, ui-monospace, monospace)" font-size="15" font-weight="600">Seek feedback &amp; iterate</text>
</svg>