<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="how-i-operate-desktop-title how-i-operate-desktop-desc">
<title id="how-i-operate-desktop-title">How I operate</title>
<desc id="how-i-operate-desktop-desc">Five-step process from understanding the system to measuring outcomes, with a feedback loop returning to the beginning.</desc>

  <defs>
    <marker id="operate-arrow-desktop" markerWidth="8" markerHeight="8" refX="6.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--accent, #7d8cff)"/>
    </marker>
    <style>
      .bg { fill: transparent; }
      .accent-stroke { stroke: var(--accent, #7d8cff); }
      .accent-fill { fill: var(--accent, #7d8cff); }
      .ink { fill: var(--ink, #f2f2f2); }
      .muted { fill: var(--ink-secondary, #a5a5a5); }
      .num {
        font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: .05em;
      }
      .title {
        font-family: var(--font-heading, Inter, system-ui, sans-serif);
        font-weight: 700;
      }
      .feedback {
        font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 14px;
        font-weight: 600;
      }
      .icon {
        stroke: var(--accent, #7d8cff);
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

<rect class="bg" width="1600" height="520"/>
<text x="42" y="70" class="ink title" font-size="52">How I operate.</text>

<!-- forward connectors -->
<g class="accent-stroke" fill="none" stroke-width="2" marker-end="url(#operate-arrow-desktop)">
  <line x1="260" y1="185" x2="385" y2="185"/>
  <line x1="570" y1="185" x2="695" y2="185"/>
  <line x1="880" y1="185" x2="1005" y2="185"/>
  <line x1="1190" y1="185" x2="1315" y2="185"/>
</g>

<!-- steps -->
<g>
  <text x="165" y="110" class="accent-fill num">01</text>
  <circle cx="175" cy="185" r="55" class="accent-stroke" fill="none" stroke-width="2"/>
  
        <g transform="translate(154.2 164.2) scale(1.3)" class="icon">
          <circle cx="10" cy="18" r="5"/><circle cx="22" cy="18" r="5"/>
          <path d="M9 13l3-7h4l2 7M23 13l-3-7h-4l-2 7M15 18h2"/>
        </g>
  <text x="175" y="290" text-anchor="middle" class="ink title" font-size="28">
    <tspan x="175" dy="0">Understand</tspan><tspan x="175" dy="32">the system</tspan>
  </text>

  <text x="475" y="110" class="accent-fill num">02</text>
  <circle cx="485" cy="185" r="55" class="accent-stroke" fill="none" stroke-width="2"/>
  
        <g transform="translate(464.2 164.2) scale(1.3)" class="icon">
          <rect x="8" y="5" width="13" height="20" rx="2"/>
          <line x1="11" y1="10" x2="18" y2="10"/>
          <circle cx="22" cy="21" r="4"/>
          <line x1="25" y1="24" x2="29" y2="28"/>
        </g>
  <text x="485" y="290" text-anchor="middle" class="ink title" font-size="28">
    <tspan x="485" dy="0">Find the</tspan><tspan x="485" dy="32">constraint</tspan>
  </text>

  <text x="785" y="110" class="accent-fill num">03</text>
  <circle cx="795" cy="185" r="55" class="accent-stroke" fill="none" stroke-width="2"/>
  
        <g transform="translate(775.0 165.0) scale(1.25)" class="icon">
          <circle cx="11" cy="12" r="4"/><circle cx="21" cy="12" r="4"/>
          <path d="M4 26c0-5 3-8 7-8s7 3 7 8"/>
          <path d="M14 26c0-5 3-8 7-8s7 3 7 8"/>
        </g>
  <text x="795" y="290" text-anchor="middle" class="ink title" font-size="28">
    <tspan x="795" dy="0">Align the team</tspan>
  </text>

  <text x="1095" y="110" class="accent-fill num">04</text>
  <circle cx="1105" cy="185" r="55" class="accent-stroke" fill="none" stroke-width="2"/>
  
        <g transform="translate(1085.0 165.0) scale(1.25)" class="icon">
          <path d="M4 15L28 5 19 28 14 19 4 15Z"/>
          <path d="M14 19L28 5"/>
        </g>
  <text x="1105" y="290" text-anchor="middle" class="ink title" font-size="28">Ship</text>

  <text x="1405" y="110" class="accent-fill num">05</text>
  <circle cx="1415" cy="185" r="55" class="accent-stroke" fill="none" stroke-width="2"/>
  
        <g transform="translate(1395.0 165.0) scale(1.25)" class="icon">
          <line x1="5" y1="27" x2="29" y2="27"/>
          <line x1="8" y1="27" x2="8" y2="18"/>
          <line x1="15" y1="27" x2="15" y2="12"/>
          <line x1="22" y1="27" x2="22" y2="7"/>
        </g>
  <text x="1415" y="290" text-anchor="middle" class="ink title" font-size="28">Measure</text>
</g>

<!-- feedback loop -->
<path d="M1415 350
         C1510 350 1510 455 1415 455
         L190 455
         C95 455 95 350 175 350"
      class="accent-stroke" fill="none" stroke-width="2"
      stroke-dasharray="4 8" marker-end="url(#operate-arrow-desktop)"/>

<rect x="650" y="438" width="300" height="34" rx="17"
      fill="var(--background, #121214)" stroke="var(--accent, #7d8cff)" stroke-width="1.5"/>
<text x="800" y="460" text-anchor="middle" class="accent-fill feedback">Seek feedback &amp; iterate</text>
</svg>