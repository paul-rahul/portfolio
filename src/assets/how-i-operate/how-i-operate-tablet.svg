<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="how-i-operate-tablet-title how-i-operate-tablet-desc">
<title id="how-i-operate-tablet-title">How I operate</title>
<desc id="how-i-operate-tablet-desc">Five-step operating model with a feedback loop from Measure back to Understand the system.</desc>

<defs>
  <marker id="operate-arrow-tablet" markerWidth="8" markerHeight="8" refX="7" refY="4"
          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0 L8 4 L0 8 Z" fill="var(--accent, #7285ff)"/>
  </marker>
</defs>
<rect width="1000" height="590" fill="transparent"/>
<text x="40" y="74" fill="var(--ink, #f4f4f5)" font-family="var(--font-heading, Inter, system-ui, sans-serif)" font-size="52" font-weight="700">How I operate.</text>

<g stroke="var(--accent, #7285ff)" stroke-width="2" fill="none" marker-end="url(#operate-arrow-tablet)">
  <line x1="190" y1="225" x2="275" y2="225"/>
  <line x1="380" y1="225" x2="465" y2="225"/>
  <line x1="570" y1="225" x2="655" y2="225"/>
  <line x1="760" y1="225" x2="845" y2="225"/>
</g>

<g font-family="var(--font-mono, ui-monospace, monospace)" font-weight="700" fill="var(--accent, #7285ff)" font-size="14">
  <text x="105" y="150">01</text><text x="295" y="150">02</text><text x="485" y="150">03</text><text x="675" y="150">04</text><text x="865" y="150">05</text>
</g>

<g fill="none" stroke="var(--accent, #7285ff)" stroke-width="2">
  <circle cx="120" cy="225" r="50"/><circle cx="310" cy="225" r="50"/><circle cx="500" cy="225" r="50"/><circle cx="690" cy="225" r="50"/><circle cx="880" cy="225" r="50"/>
</g>
<g transform="translate(101.6 206.6) scale(1.15)" stroke="var(--accent, #7285ff)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="18" r="5"/><circle cx="22" cy="18" r="5"/><path d="M9 13l3-7h4l2 7M23 13l-3-7h-4l-2 7M15 18h2"/></g>
<g transform="translate(291.6 206.6) scale(1.15)" stroke="var(--accent, #7285ff)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="5" width="13" height="20" rx="2"/><line x1="11" y1="10" x2="18" y2="10"/><circle cx="22" cy="21" r="4"/><line x1="25" y1="24" x2="29" y2="28"/></g>
<g transform="translate(482.4 207.4) scale(1.1)" stroke="var(--accent, #7285ff)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="12" r="4"/><circle cx="21" cy="12" r="4"/><path d="M4 26c0-5 3-8 7-8s7 3 7 8"/><path d="M14 26c0-5 3-8 7-8s7 3 7 8"/></g>
<g transform="translate(672.4 207.4) scale(1.1)" stroke="var(--accent, #7285ff)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15L28 5 19 28 14 19 4 15Z"/><path d="M14 19L28 5"/></g>
<g transform="translate(862.4 207.4) scale(1.1)" stroke="var(--accent, #7285ff)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="27" x2="29" y2="27"/><line x1="8" y1="27" x2="8" y2="18"/><line x1="15" y1="27" x2="15" y2="12"/><line x1="22" y1="27" x2="22" y2="7"/></g>

<g fill="var(--ink, #f4f4f5)" font-family="var(--font-heading, Inter, system-ui, sans-serif)" font-size="20" font-weight="700" text-anchor="middle">
  <text x="120" y="325"><tspan x="120">Understand</tspan><tspan x="120" dy="24">the system</tspan></text>
  <text x="310" y="325"><tspan x="310">Find the</tspan><tspan x="310" dy="24">constraint</tspan></text>
  <text x="500" y="325">Align the team</text>
  <text x="690" y="325">Ship</text>
  <text x="880" y="325">Measure</text>
</g>

<!-- feedback loop: 05 -> 01, exactly one arrowhead at destination -->
<path d="M880 370
         C955 370 955 515 880 515
         L130 515
         C55 515 55 370 120 370"
      stroke="var(--accent, #7285ff)" stroke-width="2" stroke-dasharray="4 8"
      fill="none" marker-end="url(#operate-arrow-tablet)"/>

<rect x="365" y="497" width="270" height="38" rx="19"
      fill="var(--background, #111113)" stroke="var(--accent, #7285ff)" stroke-width="1.5"/>
<text x="500" y="522" text-anchor="middle" fill="var(--accent, #7285ff)"
      font-family="var(--font-mono, ui-monospace, monospace)" font-size="14" font-weight="600">Seek feedback &amp; iterate</text>
</svg>