<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="how-i-operate-tablet-title how-i-operate-tablet-desc">
<title id="how-i-operate-tablet-title">How I operate</title>
<desc id="how-i-operate-tablet-desc">Five-step process from understanding the system to measuring outcomes, with a feedback loop returning to the beginning.</desc>

  <defs>
    <marker id="operate-arrow-tablet" markerWidth="8" markerHeight="8" refX="6.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--accent, #7d8cff)"/>
    </marker>
    <style>
      .bg { fill: transparent; }
      .accent-stroke { stroke: var(--accent, #7d8cff); }
      .accent-fill { fill: var(--accent, #7d8cff); }
      .ink { fill: var(--ink, #f2f2f2); }
      .muted { fill: var(--ink-secondary, #a5a5a5); }
      .num {
        font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: .05em;
      }
      .title {
        font-family: var(--font-heading, Inter, system-ui, sans-serif);
        font-weight: 700;
      }
      .feedback {
        font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 14px;
        font-weight: 600;
      }
      .icon {
        stroke: var(--accent, #7d8cff);
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

<rect class="bg" width="1000" height="560"/>
<text x="38" y="74" class="ink title" font-size="50">How I operate.</text>

<g class="accent-stroke" fill="none" stroke-width="2" marker-end="url(#operate-arrow-tablet)">
  <line x1="190" y1="220" x2="280" y2="220"/>
  <line x1="380" y1="220" x2="470" y2="220"/>
  <line x1="570" y1="220" x2="660" y2="220"/>
  <line x1="760" y1="220" x2="850" y2="220"/>
</g>

<g>
  <text x="95" y="152" class="accent-fill num">01</text>
  <circle cx="115" cy="220" r="50" class="accent-stroke" fill="none" stroke-width="2"/>
  
        <g transform="translate(95.8 200.8) scale(1.2)" class="icon">
          <circle cx="10" cy="18" r="5"/><circle cx="22" cy="18" r="5"/>
          <path d="M9 13l3-7h4l2 7M23 13l-3-7h-4l-2 7M15 18h2"/>
        </g>
  <text x="115" y="320" text-anchor="middle" class="ink title" font-size="20">
    <tspan x="115" dy="0">Understand</tspan><tspan x="115" dy="24">the system</tspan>
  </text>

  <text x="285" y="152" class="accent-fill num">02</text>
  <circle cx="305" cy="220" r="50" class="accent-stroke" fill="none" stroke-width="2"/>
  
        <g transform="translate(285.8 200.8) scale(1.2)" class="icon">
          <rect x="8" y="5" width="13" height="20" rx="2"/>
          <line x1="11" y1="10" x2="18" y2="10"/>
          <circle cx="22" cy="21" r="4"/>
          <line x1="25" y1="24" x2="29" y2="28"/>
        </g>
  <text x="305" y="320" text-anchor="middle" class="ink title" font-size="20">
    <tspan x="305" dy="0">Find the</tspan><tspan x="305" dy="24">constraint</tspan>
  </text>

  <text x="475" y="152" class="accent-fill num">03</text>
  <circle cx="495" cy="220" r="50" class="accent-stroke" fill="none" stroke-width="2"/>
  
        <g transform="translate(476.6 201.6) scale(1.15)" class="icon">
          <circle cx="11" cy="12" r="4"/><circle cx="21" cy="12" r="4"/>
          <path d="M4 26c0-5 3-8 7-8s7 3 7 8"/>
          <path d="M14 26c0-5 3-8 7-8s7 3 7 8"/>
        </g>
  <text x="495" y="320" text-anchor="middle" class="ink title" font-size="20">Align the team</text>

  <text x="665" y="152" class="accent-fill num">04</text>
  <circle cx="685" cy="220" r="50" class="accent-stroke" fill="none" stroke-width="2"/>
  
        <g transform="translate(666.6 201.6) scale(1.15)" class="icon">
          <path d="M4 15L28 5 19 28 14 19 4 15Z"/>
          <path d="M14 19L28 5"/>
        </g>
  <text x="685" y="320" text-anchor="middle" class="ink title" font-size="20">Ship</text>

  <text x="855" y="152" class="accent-fill num">05</text>
  <circle cx="875" cy="220" r="50" class="accent-stroke" fill="none" stroke-width="2"/>
  
        <g transform="translate(856.6 201.6) scale(1.15)" class="icon">
          <line x1="5" y1="27" x2="29" y2="27"/>
          <line x1="8" y1="27" x2="8" y2="18"/>
          <line x1="15" y1="27" x2="15" y2="12"/>
          <line x1="22" y1="27" x2="22" y2="7"/>
        </g>
  <text x="875" y="320" text-anchor="middle" class="ink title" font-size="20">Measure</text>
</g>

<path d="M875 370
         C955 370 955 495 875 495
         L125 495
         C45 495 45 370 115 370"
      class="accent-stroke" fill="none" stroke-width="2"
      stroke-dasharray="4 8" marker-end="url(#operate-arrow-tablet)"/>

<rect x="370" y="478" width="260" height="34" rx="17"
      fill="var(--background, #121214)" stroke="var(--accent, #7d8cff)" stroke-width="1.5"/>
<text x="500" y="500" text-anchor="middle" class="accent-fill feedback">Seek feedback &amp; iterate</text>
</svg>